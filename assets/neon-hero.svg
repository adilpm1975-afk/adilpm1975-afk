  <text x="1270" y="340" fill="#a5b4fc" font-family="Arial, Helvetica, sans-serif" font-size="25" font-style="italic">Good code,</text><text x="1270" y="373" fill="#67e8f9" font-family="Arial, Helvetica, sans-serif" font-size="25" font-style="italic">brighter tomorrows.</text>
  <rect x="90" y="337" width="335" height="5" rx="2.5" fill="url(#glow)"/>
