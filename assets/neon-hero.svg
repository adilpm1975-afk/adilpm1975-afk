<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">Adil P M — DevOps, Cloud, Automation</title>
  <desc id="desc">A dark neon purple and blue profile banner.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071225"/><stop offset=".45" stop-color="#16275a"/><stop offset="1" stop-color="#3f1b68"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d946ef"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <radialGradient id="sun"><stop stop-color="#fde68a"/><stop offset=".45" stop-color="#fb7185"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
  </defs>
  <rect width="1600" height="480" rx="28" fill="#050b16"/><rect x="2" y="2" width="1596" height="476" rx="26" fill="url(#sky)" stroke="#5b4aa7" stroke-width="2"/>
  <circle cx="1240" cy="190" r="150" fill="url(#sun)" filter="url(#blur)"/><path d="M0 365 C200 280 335 380 550 330 S850 250 1040 365 S1350 280 1600 320 V480 H0Z" fill="#071225" opacity=".88"/><path d="M0 394 C220 340 340 426 590 365 S970 310 1180 402 S1430 352 1600 380" fill="none" stroke="#38bdf8" stroke-opacity=".4" stroke-width="2"/>
  <g fill="#c4b5fd" opacity=".65"><circle cx="1030" cy="72" r="2"/><circle cx="1110" cy="115" r="2"/><circle cx="1210" cy="45" r="1.5"/><circle cx="1330" cy="82" r="2"/><circle cx="1460" cy="130" r="1.5"/><circle cx="1510" cy="65" r="2"/></g>
  <text x="88" y="166" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="800">Hi, I’m <tspan fill="url(#glow)">Adil</tspan></text>
  <text x="92" y="230" fill="#c4b5fd" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="8">DEVOPS  •  CLOUD  •  AUTOMATION</text>
